seed: 289
device: auto
torch_num_threads: 1

model:
  hidden_dim: 256
  num_layers: 4
  use_gru: false
  delta_limit: 10.0
  residual_scale: 0.2

training:
  batch_size: 64
  updates: 50000
  smoke_updates: 120
  train_sequence_length: 256
  learning_rate: 2.0e-4
  grad_clip_norm: 1.0
  eval_every: 500
  smoke_eval_every: 20
  val_horizon: 300
  max_val_windows: 128
  checkpoint_metric: val/VPT80@0.25
  checkpoint_mode: max

loss:
  one_step_weight: 0.2
  rollout_weight: 2.5
  rollout_train_horizon: 200

eval:
  warmup_steps: 10
  horizon: auto
  max_horizon: 1000
  report_horizons: [1, 5, 10, 50, 100, 200, 500, 1000]
  vpt_thresholds: [0.10, 0.25, 0.50]